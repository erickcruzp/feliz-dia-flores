<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz Día de las Flores Amarillas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pantalla-inicio">
        <div id="corazon-inicio"></div>
        <h1 id="nombre"></h1>
        <p id="frase">Presiona el botón para entrar a mi universo</p>
        <button id="boton">Haz clic aquí 💛</button>
    </div>

    <div id="universo" class="oculto">
        <div id="campo"></div>
        <div id="estrellas"></div>
        <div id="estrellas-fijas"></div>
        <div id="particulas"></div>
        <div id="fugaces"></div>
        
        <div id="escena-3d">
            <div id="mundo-3d">
                <div id="objetos-3d"></div>
            </div>
        </div>

        <div id="titulo-flotante">
            <span>🌻 Feliz Día de las Flores Amarillas Lu 🌻</span>
        </div>

        <button id="boton-musica">🔊</button>

        <div id="frase-flotante"></div>
        
        <h2 id="mensaje-universo">Gira el universo para descubrir mis sentimientos, Azul</h2>
    </div>

    <div id="flor-izquierda" class="oculto"></div>
    <div id="flor-derecha" class="oculto"></div>

    <div id="flor-estrellas" class="oculto"></div>

    <div id="nucleo-central" class="oculto">
        <div id="texto-te-amo">Te Amo</div>
        <div id="corazon-particulas"></div>
        <div class="brillo-nucleo"></div>
    </div>

    <div id="ramo-flores-izq" class="oculto"></div>
    <div id="ramo-flores-der" class="oculto"></div>

    <audio id="musica-fondo" loop>
        <source src="JVKE - golden hour (official music video).mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
